services:
  postgres:
    image: postgres:17-alpine
    container_name: e-engineer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: e_engineer
      POSTGRES_PASSWORD: e_engineer
      POSTGRES_DB: e_engineer
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U e_engineer -d e_engineer']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
